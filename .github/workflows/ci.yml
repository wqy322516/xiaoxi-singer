name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install (core deps only, no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: tests
        run: python -m pytest -q
      - name: import check
        run: |
          python -c "import xiaoxi_singer; print(xiaoxi_singer.__version__)"
          python -c "from xiaoxi_singer.cli import build_parser; build_parser().parse_args(['info'])"
